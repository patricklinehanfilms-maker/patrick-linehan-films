<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Asterisk Run — a small game for patrickjlinehan.com.">
<meta name="robots" content="noindex">
<title>Asterisk Run — Patrick Linehan Films</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Expanded:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* Patrick Linehan Films — site system, run as the logo itself:
     white mark and white asterisks on the brand red, ink for accents.
     One committed world, painted explicitly, so it holds on any host page. */
  :root{
    --red:#ec3013; --white:#fff; --ink:#201e1d;
    --dim:rgba(255,255,255,.72); --faint:rgba(255,255,255,.5);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;
    --wide:'Archivo Expanded',Archivo,'Helvetica Neue',Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  /* class rules set display:flex, which outranks the UA [hidden] rule */
  [hidden]{display:none!important}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--red);color:var(--white);font-family:var(--sans);overflow:hidden}

  #stage{
    position:relative;width:100%;height:100%;min-height:220px;
    background:var(--red);overflow:hidden;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #stage:focus{outline:none}
  #stage.ptr:focus-visible{outline:none}
  #stage:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  #cv{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;inset:0;pointer-events:none;
    padding:
      max(clamp(12px,2.4vw,24px), env(safe-area-inset-top))
      max(clamp(12px,2.4vw,24px), env(safe-area-inset-right))
      max(clamp(12px,2.4vw,24px), env(safe-area-inset-bottom))
      max(clamp(12px,2.4vw,24px), env(safe-area-inset-left));
    display:flex;flex-direction:column;justify-content:space-between;
    font-family:var(--mono);font-variant-numeric:tabular-nums;
  }
  .hud-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .tc{
    font-size:clamp(15px,2.6vw,22px);font-weight:500;letter-spacing:.04em;
    color:var(--white);
  }
  .meta{
    font-size:clamp(9px,1.3vw,11px);letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);text-align:right;line-height:1.7;
  }
  .meta b{font-weight:500;color:var(--white)}
  .take{
    font-size:clamp(9px,1.3vw,11px);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  }
  #sound{
    pointer-events:auto;cursor:pointer;background:none;border:0;padding:2px 0 2px 14px;
    font:inherit;font-size:clamp(9px,1.3vw,11px);letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);
  }
  #sound:hover{color:var(--ink)}
  #sound:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ---------- overlays ---------- */
  .card{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    text-align:center;padding:24px;pointer-events:none;
    /* the runner owns the lower half — keep copy clear of him, but never let the
       offset eat so much height that the headline pushes off the top */
    padding-bottom:min(36%,190px);
  }
  @media (min-aspect-ratio:5/2){ .card{padding-bottom:min(22%,150px)} }
  /* with the leaderboard open there is ~160px more to fit: give back the offset
     and step the headline down a size */
  .card.compact{padding-bottom:20px;gap:10px;justify-content:center}
  .card.compact .cut{font-size:clamp(26px,5.6vw,56px)}
  .card.compact .result{font-size:clamp(11px,1.4vw,13px)}
  .card[hidden]{display:none}
  .eyebrow{
    font-family:var(--mono);font-size:clamp(9px,1.2vw,11px);
    letter-spacing:.28em;text-transform:uppercase;color:var(--dim);
  }
  .title{
    font-family:var(--wide);font-weight:900;
    font-size:clamp(30px,7.2vw,68px);line-height:.92;letter-spacing:-.02em;
    text-transform:uppercase;color:var(--white);margin:0;text-wrap:balance;
  }
  .title .ast{color:var(--ink)}
  .cut{
    font-family:var(--wide);font-weight:900;text-transform:uppercase;
    font-size:clamp(44px,11vw,104px);line-height:.86;letter-spacing:-.03em;
    color:var(--white);margin:0;
  }
  .keys{
    font-size:clamp(11px,1.5vw,14px);color:var(--dim);letter-spacing:.02em;
  }
  .keys kbd{
    font-family:var(--mono);font-size:.92em;border:1px solid currentColor;
    border-radius:3px;padding:1px 6px;margin:0 1px;opacity:.85;
  }
  .result{
    font-family:var(--mono);font-size:clamp(12px,1.7vw,15px);
    letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums;
  }
  .result .big{color:var(--white);font-weight:500}
  .pb{
    font-family:var(--mono);font-size:clamp(9px,1.2vw,11px);letter-spacing:.22em;
    text-transform:uppercase;color:var(--white);
  }
  /* ---------- leaderboard ---------- */
  .lb{
    font-family:var(--mono);font-size:clamp(10px,1.3vw,12px);letter-spacing:.06em;
    color:var(--dim);font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;gap:2px;width:min(280px,72vw);
  }
  .lb .lbhead{
    letter-spacing:.22em;text-transform:uppercase;color:var(--white);
    padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.4);margin-bottom:4px;
  }
  .lb .row{display:flex;justify-content:space-between;gap:12px}
  .lb .row.me{color:var(--white)}
  .lb .rank{width:2.4em;flex-shrink:0}
  .lb .who{flex:1;text-align:left}
  .initials{
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:clamp(10px,1.3vw,12px);
    letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  }
  .initials input{
    font-family:var(--mono);font-size:clamp(16px,2.4vw,22px);font-weight:500;
    letter-spacing:.3em;text-transform:uppercase;
    width:4.2em;padding:6px 0 6px 8px;
    background:transparent;color:var(--white);
    border:0;border-bottom:2px solid var(--white);border-radius:0;
    outline:none;
  }
  .initials button{
    font-family:var(--mono);font-size:clamp(9px,1.2vw,11px);letter-spacing:.18em;
    text-transform:uppercase;color:var(--red);background:var(--white);
    border:0;border-radius:0;padding:9px 14px;cursor:pointer;
  }
  .initials button:hover{background:var(--ink);color:var(--white)}

  #focusHint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);pointer-events:none;opacity:0;transition:opacity 200ms linear;
  }
  #focusHint.show{opacity:1}

  /* phones: the vw terms bottom out, so set real sizes and give the copy room */
  @media (max-width:560px){
    .tc{font-size:17px}
    .meta,.take,#sound{font-size:10px;letter-spacing:.12em}
    .keys{font-size:12px}
    .card{padding-left:16px;padding-right:16px;gap:11px}
    #sound{padding-left:10px}
  }

  /* Embedded, a finger swipe has to keep scrolling the host page, so only the
     standalone page claims the gesture. Both stop double-tap zoom. */
  #stage{touch-action:manipulation}
  #stage.solo{touch-action:none}

  @media (prefers-reduced-motion:reduce){
    #stage{transition:none}
  }
</style>

</head>
<body>
<div id="stage" tabindex="0" role="application"
     aria-label="Asterisk Run — jump the running mark over asterisks. Space or tap to jump, arrow down to duck.">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="hud-row">
      <div class="tc" id="tc">00:00:00</div>
      <div class="meta">
        <div>Best <b id="best">00:00:00</b></div>
        <div><button id="sound" type="button" aria-pressed="false">Sound off</button></div>
      </div>
    </div>
    <div class="hud-row">
      <div class="take" id="take">Take 01</div>
      <div class="take" id="spd"></div>
    </div>
  </div>

  <div class="card" id="startCard">
    <div class="eyebrow">Patrick Linehan Films</div>
    <h1 class="title">Asterisk<span class="ast">*</span>Run</h1>
    <div class="keys"><kbd>Space</kbd> to jump · <kbd>↓</kbd> to duck · or tap</div>
  </div>

  <div class="card" id="overCard" hidden>
    <p class="cut">Cut.</p>
    <div class="result">Take <span id="oTake">01</span> — <span class="big" id="oTc">00:00:00</span></div>
    <div class="pb" id="oPb" hidden>New best</div>
    <div class="initials" id="oEntry" hidden>
      <span>Initials</span>
      <input id="oIn" maxlength="3" autocomplete="off" spellcheck="false" aria-label="Your initials">
      <button id="oSave" type="button">Post</button>
    </div>
    <div class="lb" id="oBoard" hidden></div>
    <div class="keys"><kbd>Space</kbd> for take <span id="oNext">02</span></div>
  </div>

  <div id="focusHint">Click to play</div>
</div>

  const RUN_ASPECT = 99 / 128;        // the mark holds one pose — no sprite sheet

  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Tint a white-alpha mask into a solid colour once, and cache it.
  const tintCache = new Map();
  function tinted(img, colour) {
    const key = img.src.slice(-24) + colour;
    let c = tintCache.get(key);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = colour;
    g.fillRect(0, 0, c.width, c.height);
    tintCache.set(key, c);
    return c;
  }

  // ------------------------------------------------------------ world size
  // On a wide screen the height fills and the extra width is free runway.
  // On a phone that would leave barely 200 units of track — the asterisks would
  // appear almost on top of the runner — so we hold a MINIMUM visible width and
  // let the world zoom out instead. Whichever constraint bites, the runner keeps
  // his real proportions; only the on-screen size changes.
  const MOBILE_MAX = 760;  // the site's own mobile breakpoint — below this, mobile rules
  const W_MIN = 560;   // never show less track than this, at any size
  const H_MIN = 260;   // never show less sky than this
  const W_REF = 685;   // the width a comfortable desktop embed gets
  const BAND  = 360;   // the action band; extra height becomes sky, not stretch

  let W = W_REF, H = H_MIN, GROUND_Y = 212, BAND_TOP = 0, ws = 1, DPR = 1, mobile = false;

  function resize() {
    const r = stage.getBoundingClientRect();
    const cw = Math.max(240, r.width), ch = Math.max(160, r.height);

    // The 760 breakpoint decides the mobile TREATMENT (band placement, touch copy,
    // compact HUD, gesture handling). The minimum-track floor is not mobile-only:
    // without it a tall desktop window collapses to ~300 units of track with a
    // giant runner, which is worse than any phone. On a normal wide embed the
    // height binds first and the floor never engages, so desktop is untouched.
    mobile = cw <= MOBILE_MAX;
    const scale = Math.min(cw / W_MIN, ch / H_MIN);
    W = cw / scale;
    H = ch / scale;

    // Sit the action in a band rather than stranding it at the bottom of a tall
    // phone screen. The ground is a touch below centre, which reads as grounded.
    const bandH = Math.min(H, BAND);
    BAND_TOP = (H - bandH) * (mobile ? 0.72 : 0.55);
    GROUND_Y = BAND_TOP + bandH - 48;

    // Everything moves proportionally to how much track is visible, so an
    // asterisk takes the same wall-clock time to cross any screen size.
    ws = W / W_REF;

    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cw * DPR);
    cv.height = Math.round(ch * DPR);
    ctx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    if (clouds.length) placeClouds();
  }
  new ResizeObserver(resize).observe(stage);

  // ------------------------------------------------------------- constants
  const GRAV = 2500, JUMP_V = -800, CUT = 0.62, FALL_BOOST = 1900;
  // He faces left and runs on the left; the asterisks sweep past him right to left.
  const RUN_H = 78, RUN_W = RUN_H * RUN_ASPECT, RUN_X = 92;
  const HB = { x0:0.26, x1:0.55, y0:0.10, y1:0.98 };   // torso box inside the pose
  const DUCK_S = 0.60;
  const SPD0 = 330, SPD_MAX = 720, SPD_RAMP = 0.0055;
  const FPS_TC = 24, UNITS_PER_FRAME = 14;

  // --------------------------------------------------------------- state
  let running = false, over = false, started = false;
  let dist = 0, speed = SPD0, best = 0, take = 1;
  let shake = 0, groundOff = 0;
  const runner = { y:0, vy:0, ducking:false, held:false, dead:false };
  let obstacles = [], nextGap = 420;

  // best score persists per viewer; storage can be absent or throw.
  try { best = parseInt(localStorage.getItem('plf.asteriskrun.best') || '0', 10) || 0; } catch (e) {}

  // ---------------------------------------------------------- leaderboard
  // Paste the Worker URL here to make the board shared (see worker/README.md).
  // Left empty, everything below still works — the board is just local.
  const LB_API = 'https://asterisk-run-leaderboard.patrick-linehan-films.workers.dev';

  let lbTop = [];        // [{ initials, frames }] best first
  let lbMine = null;     // the row this session posted, so it can be highlighted
  let lbPending = 0;     // frames awaiting initials

  function lbLocal(read, write) {
    try {
      if (write) { localStorage.setItem('plf.asteriskrun.board', JSON.stringify(write)); return write; }
      return read ? (JSON.parse(localStorage.getItem('plf.asteriskrun.board') || '[]') || []) : [];
    } catch (e) { return []; }
  }

  function lbInitials() {
    try { return localStorage.getItem('plf.asteriskrun.initials') || ''; } catch (e) { return ''; }
  }

  async function lbLoad() {
    if (!LB_API) { lbTop = lbLocal(true); return; }
    try {
      const r = await fetch(LB_API + '/scores', { cache: 'no-store' });
      const d = await r.json();
      if (Array.isArray(d.top)) lbTop = d.top;
    } catch (e) { lbTop = lbLocal(true); }   // offline or Worker down: show the local board
  }

  async function lbPost(initials, frames) {
    const entry = { initials: initials, frames: frames, at: Date.now() };
    lbMine = entry;
    try { localStorage.setItem('plf.asteriskrun.initials', initials); } catch (e) {}

    if (!LB_API) {
      const list = lbLocal(true).concat([entry]).sort((a, b) => b.frames - a.frames).slice(0, 20);
      lbTop = lbLocal(false, list);
      return;
    }
    try {
      const r = await fetch(LB_API + '/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initials: initials, frames: frames })
      });
      const d = await r.json();
      if (Array.isArray(d.top)) lbTop = d.top;
    } catch (e) {
      lbTop = lbLocal(false, lbLocal(true).concat([entry]).sort((a, b) => b.frames - a.frames).slice(0, 20));
    }
  }

  function lbRender() {
    // a short embed (mobile is 300px) only has room for a few rows
    const room = (stage.clientHeight || 480) < 380 ? 3 : 5;
    const rows = lbTop.slice(0, room);
    if (!rows.length) { el.oBoard.hidden = true; return; }
    const head = '<div class="lbhead">' + (LB_API ? 'Top takes' : 'Your takes') + '</div>';
    el.oBoard.innerHTML = head + rows.map(function (r, i) {
      const me = lbMine && r.initials === lbMine.initials && r.frames === lbMine.frames;
      return '<div class="row' + (me ? ' me' : '') + '">' +
        '<span class="rank">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="who">' + r.initials + '</span>' +
        '<span>' + timecode(r.frames) + '</span></div>';
    }).join('');
    el.oBoard.hidden = false;
  }

  function lbSubmit() {
    if (!lbPending) return;
    const v = (el.oIn.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
    if (!v) { el.oIn.focus(); return; }
    const frames = lbPending;
    lbPending = 0;
    el.oEntry.hidden = true;
    lbPost(v, frames).then(function () {
      lbRender();
      el.over.classList.toggle('compact', !el.oBoard.hidden);
    });
  }

  el.oSave.addEventListener('click', function (e) { e.stopPropagation(); lbSubmit(); });
  el.oIn.addEventListener('keydown', function (e) {
    e.stopPropagation();                       // don't let Space restart the game
    if (e.code === 'Enter') { e.preventDefault(); lbSubmit(); }
  });
  el.oIn.addEventListener('keyup', function (e) { e.stopPropagation(); });
  el.oIn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  el.oEntry.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

  lbLoad();

  // ------------------------------------------------------------- timecode
  function timecode(frames) {
    const f = Math.max(0, Math.floor(frames));
    const totalSec = Math.floor(f / FPS_TC);
    const mm = Math.min(99, Math.floor(totalSec / 60));
    const ss = totalSec % 60;
    const ff = f % FPS_TC;
    const p = n => String(n).padStart(2, '0');
    return p(mm) + ':' + p(ss) + ':' + p(ff);
  }
  const scoreFrames = () => Math.floor(dist / UNITS_PER_FRAME);

  // ---------------------------------------------------------------- audio
  let audioOn = false, actx = null;
  function blip(freq, dur, type, gain) {
    if (!audioOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(gain || 0.035, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  el.sound.addEventListener('click', e => {
    e.stopPropagation();
    audioOn = !audioOn;
    el.sound.textContent = audioOn ? 'Sound on' : 'Sound off';
    el.sound.setAttribute('aria-pressed', String(audioOn));
    if (audioOn) blip(660, 0.07);
  });

  // ------------------------------------------------------------ obstacles
  function spawn() {
    const t = scoreFrames();
    const flying = t > 320 && Math.random() < 0.22;
    if (flying) {
      obstacles.push({ air:true, x:W + 40, size:38, rot:Math.random() * 6.28, spin:(Math.random() - 0.5) * 1.4,
                       // low enough that a standing runner is caught, high enough that a duck clears it
                       yc: GROUND_Y - 60 - Math.random() * 8 });
    } else {
      const n = Math.random() < 0.16 ? 3 : (Math.random() < 0.38 ? 2 : 1);
      let x = W + 40;
      for (let i = 0; i < n; i++) {
        const size = 34 + Math.random() * (n === 1 ? 26 : 12);
        obstacles.push({ air:false, x, size, rot:Math.random() * 6.28, spin:(Math.random() - 0.5) * 0.9 });
        x += size * (n === 3 ? 0.70 : 0.92);
      }
    }
    const base = Math.min(SPD_MAX, SPD0 + dist * SPD_RAMP);
    const tight = Math.max(0, Math.min(1, (base - SPD0) / (SPD_MAX - SPD0)));
    // gaps scale with the track so the rhythm is the same everywhere
    nextGap = ((340 - tight * 60) + Math.random() * (300 - tight * 110)) * ws;
  }

  const skyY = () => BAND_TOP + 20 + Math.random() * Math.max(30, (GROUND_Y - BAND_TOP) * 0.45);
  function makeClouds() {
    clouds = [];
    for (let i = 0; i < 7; i++) {
      clouds.push({ x: Math.random() * W, y: skyY(),
                    s: 9 + Math.random() * 15, d: 0.05 + Math.random() * 0.14,
                    rot: Math.random() * 6.28 });
    }
  }
  // after a resize the old positions belong to a different sky
  function placeClouds() {
    for (const c of clouds) { if (c.x > W) c.x = Math.random() * W; c.y = skyY(); }
  }

  // ----------------------------------------------------------------- loop
  function reset() {
    dist = 0; speed = SPD0 * ws; obstacles = []; nextGap = 420 * ws;
    runner.y = 0; runner.vy = 0; runner.ducking = false; runner.dead = false;
    shake = 0;
    makeClouds();
  }

  function start() {
    if (running) return;
    reset();
    running = true; over = false; started = true;
    el.start.hidden = true; el.over.hidden = true;
    el.take.textContent = 'Take ' + String(take).padStart(2, '0');
    last = performance.now();
    requestAnimationFrame(tick);
  }

  function jump() {
    if (!running) { start(); return; }
    if (runner.y === 0 && !runner.dead) {
      runner.vy = JUMP_V; runner.held = true;
      blip(520, 0.06, 'square', 0.03);
    }
  }
  function releaseJump() {
    if (runner.held && runner.vy < 0) runner.vy *= CUT;
    runner.held = false;
  }
  function duck(on) {
    runner.ducking = on && !runner.dead;
    if (on && runner.y < 0) runner.vy += FALL_BOOST * 0.016;   // fast-fall
  }

  function die() {
    running = false; over = true; runner.dead = true; runner.ducking = false;
    if (!REDUCED) shake = 1;
    blip(180, 0.28, 'sawtooth', 0.05);
    const f = scoreFrames();
    const isPb = f > best;
    if (isPb) { best = f; saveBest(); el.best.textContent = timecode(best); }
    el.oTake.textContent = String(take).padStart(2, '0');
    el.oTc.textContent = timecode(f);
    el.oPb.hidden = !isPb;
    // offer the board only for a run worth posting
    const lowest = lbTop.length >= 5 ? lbTop[Math.min(4, lbTop.length - 1)].frames : 0;
    if (f > 0 && (lbTop.length < 5 || f > lowest)) {
      lbPending = f;
      el.oIn.value = lbInitials();
      el.oEntry.hidden = false;
    } else {
      lbPending = 0;
      el.oEntry.hidden = true;
    }
    lbRender();
    // the board and initials row need the vertical space the runner offset takes
    el.over.classList.toggle('compact', !el.oEntry.hidden || !el.oBoard.hidden);
    take++;
    el.oNext.textContent = String(take).padStart(2, '0');
    el.over.hidden = false;
  }

  function hitbox() {
    const h = runner.ducking ? RUN_H * DUCK_S : RUN_H;
    const w = runner.ducking ? RUN_W * 1.10 : RUN_W;
    const top = GROUND_Y - h + runner.y;
    return { x: RUN_X + HB.x0 * w, y: top + HB.y0 * h,
             w: (HB.x1 - HB.x0) * w, h: (HB.y1 - HB.y0) * h };
  }

  function update(dt) {
    // dist is in reference units so score and difficulty are identical on every
    // screen; only the on-screen speed is scaled to the visible track.
    const base = Math.min(SPD_MAX, SPD0 + dist * SPD_RAMP);
    dist += base * dt;
    speed = base * ws;
    groundOff = (groundOff + speed * dt) % 24;

    runner.vy += GRAV * dt * (runner.ducking && runner.y < 0 ? 1.7 : 1);
    runner.y += runner.vy * dt;
    if (runner.y > 0) { runner.y = 0; runner.vy = 0; }

    for (const o of obstacles) { o.x -= speed * dt; o.rot += o.spin * dt; }
    obstacles = obstacles.filter(o => o.x > -140);

    nextGap -= speed * dt;
    if (nextGap <= 0) spawn();

    for (const c of clouds) {
      c.x -= speed * c.d * dt;
      c.rot += 0.12 * dt;
      if (c.x < -60) { c.x = W + 40; c.y = skyY(); }
    }

    const hb = hitbox();
    for (const o of obstacles) {
      const pad = o.air ? 0.30 : 0.26;               // asterisk arms are sparse — be fair
      const ow = o.size * (1 - pad * 2), oh = o.size * (1 - pad * 2);
      const ox = o.x + o.size * pad;
      const oy = (o.air ? o.yc - o.size / 2 : GROUND_Y - o.size) + o.size * pad;
      if (hb.x < ox + ow && hb.x + hb.w > ox && hb.y < oy + oh && hb.y + hb.h > oy) { die(); return; }
    }
  }

  // ----------------------------------------------------------------- draw
  let grain = null, grainPat = null;
  function makeGrain() {
    const c = document.createElement('canvas');
    c.width = c.height = 96;
    const g = c.getContext('2d');
    const im = g.createImageData(96, 96);
    for (let i = 0; i < im.data.length; i += 4) {
      const v = 128 + (Math.random() - 0.5) * 255;
      im.data[i] = im.data[i+1] = im.data[i+2] = v;
      im.data[i+3] = 15;
    }
    g.putImageData(im, 0, 0);
    grain = c;
    grainPat = ctx.createPattern(c, 'repeat');
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      const m = shake * 5;
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }

    ctx.fillStyle = COL.red;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // parallax asterisks
    if (astImg) {
      const faint = tinted(astImg, COL.white);
      for (const c of clouds) {
        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.translate(c.x, c.y); ctx.rotate(c.rot);
        ctx.drawImage(faint, -c.s / 2, -c.s / 2, c.s, c.s);
        ctx.restore();
      }
    }

    // ground: solid rule + ticks travelling with the world
    ctx.fillStyle = COL.white;
    ctx.fillRect(0, GROUND_Y, W, 2);
    ctx.globalAlpha = 0.45;
    for (let x = -24 - groundOff; x < W + 24; x += 24) ctx.fillRect(x, GROUND_Y + 7, 10, 2);
    ctx.globalAlpha = 1;

    // obstacles
    if (astImg) {
      const ast = tinted(astImg, COL.white);
      for (const o of obstacles) {
        const cx = o.x + o.size / 2;
        const cy = o.air ? o.yc : GROUND_Y - o.size / 2;
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(o.rot);
        ctx.drawImage(ast, -o.size / 2, -o.size / 2, o.size, o.size);
        ctx.restore();
      }
    }

    // runner
    if (runImg) {
      const sprite = tinted(runImg, COL.white);
      const h = runner.ducking ? RUN_H * DUCK_S : RUN_H;
      const w = runner.ducking ? RUN_W * 1.10 : RUN_W;
      const top = GROUND_Y - h + runner.y;
      ctx.save();
      if (runner.dead) ctx.globalAlpha = 0.72;
      ctx.drawImage(sprite, RUN_X, top, w, h);
      ctx.restore();
    }

    ctx.restore();

    if (grainPat && !REDUCED) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      const ox = -(Math.random() * 96) | 0, oy = -(Math.random() * 96) | 0;
      ctx.fillStyle = grainPat;
      ctx.translate(ox, oy);
      ctx.fillRect(0, 0, W + 96, H + 96);
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------- ticks
  let last = 0;
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (paused) return;
    if (running) update(dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 3.4);
    draw();
    el.tc.textContent = timecode(scoreFrames());
    if (running || shake > 0) requestAnimationFrame(tick);
  }

  // --------------------------------------------------------------- input
  // Only claim the keyboard when this game is actually the thing in focus —
  // otherwise Space would hijack scrolling on the page that embeds it.
  const EMBEDDED = window.self !== window.top;
  let hovered = false, focused = false;
  const armed = () => focused || (hovered && !EMBEDDED);

  stage.addEventListener('pointerenter', () => { hovered = true; });
  stage.addEventListener('pointerleave', () => { hovered = false; duck(false); });
  stage.addEventListener('focus', () => { focused = true; el.hint.classList.remove('show'); });
  stage.addEventListener('blur', () => { focused = false; });

  window.addEventListener('keydown', e => {
    if (e.code === 'Tab') stage.classList.remove('ptr');
    if (!armed()) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (over) { start(); return; }
      jump();
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      e.preventDefault(); duck(true);
    } else if (e.code === 'KeyR') {
      e.preventDefault(); if (!running) start();
    }
  });
  window.addEventListener('keyup', e => {
    if (!armed()) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') releaseJump();
    if (e.code === 'ArrowDown' || e.code === 'KeyS') duck(false);
  });

  stage.addEventListener('pointerdown', e => {
    if (e.target === el.sound) return;
    stage.classList.add('ptr');
    stage.focus({ preventScroll: true });
    const r = stage.getBoundingClientRect();
    const lower = (e.clientY - r.top) > r.height * 0.70;
    if (over) { start(); return; }
    if (lower && running) duck(true); else jump();
  });
  window.addEventListener('pointerup', () => { releaseJump(); duck(false); });
  stage.addEventListener('contextmenu', e => e.preventDefault());

  let paused = false;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { paused = true; return; }
    if (paused) { paused = false; last = performance.now(); if (running) requestAnimationFrame(tick); }
  });

  // in an iframe the page can't type until the frame has focus — say so
  if (EMBEDDED) {
    setTimeout(() => { if (!focused && !started) el.hint.classList.add('show'); }, 1200);
  } else {
    stage.classList.add('solo');
  }

  // On a phone there is no Space bar and no arrow keys — say what actually works.
  if (TOUCH) {
    el.start.querySelector('.keys').innerHTML =
      'Tap to jump · hold the bottom of the screen to duck';
    el.over.querySelector('.keys').innerHTML =
      'Tap for take <span id="oNext">02</span>';
    el.oNext = el.over.querySelector('#oNext');
    stage.setAttribute('aria-label',
      'Asterisk Run — tap to jump the running mark over the asterisks, hold the bottom of the screen to duck.');
  }

  // ---------------------------------------------------------------- boot
  let runImg = null, astImg = null, loaded = 0;
  function ready() {
    if (++loaded < 2) return;
    resize(); makeGrain();
    el.best.textContent = timecode(best);
    el.spd.textContent = '24 fps';
    draw();
    // idle attract: the mark runs on the spot until the first input
    (function idle() {
      if (started) return;
      groundOff = (groundOff + 2.2) % 24;
      for (const c of clouds) { c.x -= c.d * 2.2; c.rot += 0.004; if (c.x < -60) c.x = W + 40; }
      draw();
      requestAnimationFrame(idle);
    })();
  }
  runImg = new Image(); runImg.onload = ready; runImg.src = RUNNER_SRC;
  astImg = new Image(); astImg.onload = ready; astImg.src = AST_SRC;
  makeClouds();
})();
</script>

</body>
</html>
